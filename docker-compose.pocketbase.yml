version: '3.8'

services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
    container_name: mind-pwa-pocketbase
    restart: unless-stopped
    user: "1028:100"
    # Remove external port exposure - only accessible via nginx
    expose:
      - "8090"
    volumes:
      - /volume1/projects/mind-pwa/pocketbase/pb_data:/pb/pb_data
      - /volume1/projects/mind-pwa/pocketbase/pb_public:/pb/pb_public
      - /volume1/projects/mind-pwa/pocketbase/pb_migrations:/pb/pb_migrations
    environment:
      - PB_DATA_DIR=/pb/pb_data
      - PB_PUBLIC_DIR=/pb/pb_public
      - PB_MIGRATIONS_DIR=/pb/pb_migrations
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mind-pwa-network

  nginx:
    image: nginx:latest
    container_name: mind-pwa-nginx
    restart: unless-stopped
    ports:
      - "8080:80" # Use a test port
    volumes:
      - /volume1/web/mind-pwa-deploy:/usr/share/nginx/html
      - /volume1/projects/mind-pwa/nginx/nginx.pocketbase.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - mind-pwa-network

networks:
  mind-pwa-network:
    driver: bridge
